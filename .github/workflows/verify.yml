name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0
      - name: Install pinned project tools and packages
        shell: pwsh
        run: ./scripts/setup.ps1 -NoTrustCheck
      - name: Verify
        shell: pwsh
        run: ./scripts/verify.ps1
